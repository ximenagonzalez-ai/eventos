<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Recuperar Contraseña</h2>
    <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecerla.</p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="tu@correo.com">
      </div>

      <button type="submit" [disabled]="isLoading" class="btn-primary">
        {{ isLoading ? 'Enviando...' : 'Enviar enlace' }}
      </button>
    </form>

    <p *ngIf="mensaje" class="alert-success">{{ mensaje }}</p>
    <p *ngIf="error" class="alert-error">{{ error }}</p>

    <div class="auth-links">
      <a routerLink="/login">Volver a Iniciar Sesión</a>
    </div>
  </div>
</div>
