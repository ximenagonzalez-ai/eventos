<div class="register-wrapper">
  <div class="register-card">
    <h2>Crear Cuenta</h2>
    <p class="subtitle">Únete a <strong>VibePass</strong> y accede a los mejores eventos.</p>

    <div *ngIf="errorMessage" class="error-alert">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="success-alert">
      {{ successMessage }}
    </div>

    <form (ngSubmit)="onRegister()">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input
          type="text"
          id="nombre"
          name="nombreCompleto"
          [(ngModel)]="userData.nombreCompleto"
          placeholder="Tu nombre completo"
          required>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="userData.email"
          placeholder="tucorreo@ejemplo.com"
          required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="userData.password"
          placeholder="••••••••"
          required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="••••••••"
          required>
      </div>

      <div class="form-group">
        <label for="rol">Tipo de Cuenta</label>
        <select id="rol" name="rol" [(ngModel)]="userData.rol" class="select-input">
          <option value="USER">Usuario (Comprar Boletos)</option>
          <option value="ADMIN">Administrador (Crear y Gestionar Eventos)</option>
        </select>
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        {{ isLoading ? 'Registrando...' : 'Registrarse' }}
      </button>
    </form>

    <div class="register-footer">
      <span>¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión aquí</a></span>
    </div>
  </div>
</div>
