<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Nueva Contraseña</h2>
    <p>Ingresa tu nueva contraseña (mínimo 8 caracteres).</p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="nuevaContrasena">Nueva Contraseña</label>
        <input type="password" id="nuevaContrasena" name="nuevaContrasena" [(ngModel)]="nuevaContrasena" required minlength="8">
      </div>

      <div class="form-group">
        <label for="confirmarContrasena">Confirmar Contraseña</label>
        <input type="password" id="confirmarContrasena" name="confirmarContrasena" [(ngModel)]="confirmarContrasena" required minlength="8">
      </div>

      <button type="submit" [disabled]="isLoading || !token" class="btn-primary">
        {{ isLoading ? 'Actualizando...' : 'Actualizar Contraseña' }}
      </button>
    </form>

    <p *ngIf="!token" class="alert-error">Token no detectado en la URL.</p>
    <p *ngIf="mensaje" class="alert-success">{{ mensaje }}</p>
    <p *ngIf="error" class="alert-error">{{ error }}</p>
  </div>
</div>
