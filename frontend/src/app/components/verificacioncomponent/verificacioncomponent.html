<div class="auth-container">
  <div class="auth-card">
    <h2>Verificación de Cuenta</h2>

    <div *ngIf="cargando" class="estado-box">
      <div class="spinner"></div>
      <p>Estamos verificando tu token, por favor espera...</p>
    </div>

    <div *ngIf="exito" class="mensaje-box success">
      <div class="icon-success">✓</div>
      <p>{{ mensaje }}</p>
      <button class="btn-primary" routerLink="/login">Ir a Iniciar Sesión</button>
    </div>

    <div *ngIf="error" class="mensaje-box error" role="alert">
      <div class="icon-error">✕</div>
      <p>{{ mensaje }}</p>
      <small *ngIf="codigoError" class="error-code">Código: {{ codigoError }}</small>

      <div class="reenvio-box" *ngIf="!reenvioExitoso">
        <p class="reenvio-texto">¿Quieres que te enviemos un nuevo enlace?</p>
        <input
          type="email"
          [(ngModel)]="emailReenvio"
          name="emailReenvio"
          placeholder="Tu correo electrónico"
          class="input-email"
        />
        <button class="btn-primary" (click)="reenviarVerificacion()" [disabled]="enviandoReenvio">
          {{ enviandoReenvio ? 'Enviando...' : 'Reenviar enlace de verificación' }}
        </button>
        <p *ngIf="errorReenvio" class="msg-error-reenvio">{{ errorReenvio }}</p>
      </div>

      <p *ngIf="reenvioExitoso" style="color: #34d399; margin-top: 12px;">
        ✅ Te enviamos un nuevo enlace. Revisa tu correo.
      </p>

      <button class="btn-secondary" routerLink="/login">Volver al Inicio de Sesión</button>
    </div>

  </div>
</div>
